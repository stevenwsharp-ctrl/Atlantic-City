<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>House Money</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e0f11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: private-bank style phone app. Large serif titles, inset grouped lists, hairlines, one champagne accent. Dark first. */
:root {
  --bg: #0e0f11; --surface: #17191c; --raised: #202328; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
  --ink: #f3f1ec; --ink-2: #c9c7c1; --muted: #858a92; --gold: #cfaa63; --gold-ink: #1a1408;
  --win: #4cc08e; --loss: #ef6b5f; --sel: #f3f1ec; --sel-ink: #0e0f11;
  --av-1: #3a4a63; --av-2: #5a3d48; --av-3: #3c5a4c; --av-4: #5e5136; --av-5: #4b3e63; --av-6: #2f5559;
  --bar-bg: rgba(14,15,17,.82);
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Geist", -apple-system, system-ui, "Segoe UI", sans-serif;
  --f-num: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4f3f0; --surface: #ffffff; --raised: #ecebe7; --line: rgba(20,21,24,.08); --line-2: rgba(20,21,24,.16);
  --ink: #141518; --ink-2: #3b3d42; --muted: #73777e; --gold: #9c7a36; --gold-ink: #ffffff;
  --win: #17855a; --loss: #c8443a; --sel: #141518; --sel-ink: #ffffff;
  --av-1: #5d7396; --av-2: #95646f; --av-3: #5b8a72; --av-4: #9a8350; --av-5: #7a6699; --av-6: #4d8388;
  --bar-bg: rgba(244,243,240,.85); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f4f3f0; --surface: #ffffff; --raised: #ecebe7; --line: rgba(20,21,24,.08); --line-2: rgba(20,21,24,.16);
  --ink: #141518; --ink-2: #3b3d42; --muted: #73777e; --gold: #9c7a36; --gold-ink: #ffffff;
  --win: #17855a; --loss: #c8443a; --sel: #141518; --sel-ink: #ffffff;
  --av-1: #5d7396; --av-2: #95646f; --av-3: #5b8a72; --av-4: #9a8350; --av-5: #7a6699; --av-6: #4d8388;
  --bar-bg: rgba(244,243,240,.85); color-scheme: light; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; letter-spacing: -.005em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.win { color: var(--win); } .loss { color: var(--loss); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.gutter { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* top bar */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(140%) blur(18px); backdrop-filter: saturate(140%) blur(18px);
  padding-block: 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid transparent; }
header.top.scrolled { border-bottom-color: var(--line); }
.trip { background: none; border: 0; padding: 0; text-align: left; margin-right: auto; display: grid; min-width: 0; }
.trip .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.trip .where { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.trip .where svg { width: 14px; height: 14px; color: var(--muted); }
.stack { display: flex; background: none; border: 0; padding: 0; align-items: center; }
.stack .mono { width: 30px; height: 30px; font-size: 12px; margin-left: -8px; box-shadow: 0 0 0 2px var(--bg); }
.stack .mono:first-child { margin-left: 0; }
.round { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; display: grid; place-items: center; flex: none; color: var(--ink); }
.round svg { width: 18px; height: 18px; }

main { padding-block: 4px calc(110px + env(safe-area-inset-bottom, 0px)); max-width: 620px; margin: 0 auto; display: grid; gap: 28px; }
.page-title { font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: -.01em; margin: 10px 0 0; text-wrap: balance; }
.section { display: grid; gap: 10px; min-width: 0; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px; }
.section-h h3 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--gold); font-weight: 500; font-size: 14px; }

.group { background: var(--surface); border-radius: 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; position: relative; min-width: 0; }
.group .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; height: 1px; background: var(--line); }
.group .row.indent + .row.indent::before { left: 60px; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 500; letter-spacing: -.02em; text-align: right; white-space: nowrap; }
.rank { width: 14px; font-family: var(--f-num); font-size: 12px; color: var(--muted); text-align: center; flex: none; }
.empty { padding: 22px 16px; color: var(--muted); font-size: 14px; text-align: center; }

.mono { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; color: #fff; flex: none; letter-spacing: 0; }
.tiny { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; display: grid; place-items: center; color: var(--muted); flex: none; padding: 0; }
.tiny svg { width: 14px; height: 14px; }

.btn { border-radius: 14px; padding: 14px 18px; font-weight: 600; font-size: 15px; background: var(--raised); color: var(--ink); border: 0; }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.notice { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--line-2); border-radius: 14px; font-size: 13px; color: var(--ink-2); }
.notice .grow { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-2); background: transparent; border-radius: 10px; padding: 8px 13px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
.chip .x { margin-left: 6px; opacity: .55; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--raised); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 8px 6px; font-weight: 500; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.25); }

.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.input { width: 100%; border: 1px solid var(--line-2); background: transparent; border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* results hero */
.hero { display: grid; gap: 4px; }
.hero .lbl { padding-left: 2px; }
.hero .big { font-family: var(--f-display); font-size: 68px; line-height: .95; letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; }
.spark { width: 100%; height: 64px; display: block; margin-top: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 6px; }
.stats div { padding: 12px 0 12px 12px; display: grid; gap: 2px; min-width: 0; }
.stats div:first-child { padding-left: 2px; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { font-family: var(--f-num); font-weight: 500; font-size: 16px; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar-bg); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: saturate(140%) blur(18px); backdrop-filter: saturate(140%) blur(18px);
  display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: start;
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs button.tab { background: none; border: 0; padding: 9px 2px 9px; display: grid; justify-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
nav.tabs button.tab svg { width: 23px; height: 23px; }
nav.tabs button.tab[aria-current="page"] { color: var(--ink); }
.fab { justify-self: center; margin-top: -18px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--gold); color: var(--gold-ink);
  display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.35), 0 0 0 5px var(--bg); }
.fab svg { width: 24px; height: 24px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; border-radius: 22px 22px 0 0; max-height: 94vh; overflow-y: auto;
  padding-block: 8px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; animation: up .24s cubic-bezier(.2,.8,.2,1); }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line-2); justify-self: center; }
.sheet-h { display: flex; align-items: center; gap: 12px; }
.sheet-h h2 { flex: 1; margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }

.amounts { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line-2); border-radius: 16px; overflow: hidden; }
.amt { background: transparent; border: 0; padding: 14px 16px 12px; text-align: left; display: grid; gap: 4px; position: relative; }
.amt + .amt { border-left: 1px solid var(--line-2); }
.amt::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px; background: transparent; }
.amt[aria-pressed="true"]::after { background: var(--gold); }
.amt span { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.amt b { font-family: var(--f-num); font-size: 28px; font-weight: 400; letter-spacing: -.03em; }
.amt[aria-pressed="true"] span { color: var(--gold); }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick button { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 9px 0; font-family: var(--f-num); font-size: 14px; color: var(--ink-2); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.keypad button { border: 0; background: transparent; border-radius: 14px; padding: 13px 0; font-family: var(--f-body); font-size: 26px; font-weight: 300; display: grid; place-items: center; }
.keypad button:active { background: var(--raised); }
.netline { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 14px; }
.netline b { font-family: var(--f-display); font-size: 34px; font-weight: 400; line-height: 1; }

/* roulette */
.wheel-wrap { position: relative; width: min(100%, 330px); aspect-ratio: 1; max-width: 100%; justify-self: center; margin-top: 8px; }
.wheel-wrap canvas { width: 100%; height: 100%; display: block; }
.pointer { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); width: 18px; height: 26px; }
.result { text-align: center; display: grid; gap: 6px; padding-top: 4px; }
.result .who { font-family: var(--f-display); font-size: 54px; line-height: 1; }
.controls { display: grid; gap: 14px; }

/* split */
.transfer { display: flex; align-items: center; gap: 10px; }
.transfer .arrow { color: var(--muted); width: 16px; height: 16px; flex: none; }
.room-head { display: grid; gap: 2px; padding: 16px 16px 12px; }
.room-head .t { font-weight: 600; }
.room-total { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper b { min-width: 20px; text-align: center; font-family: var(--f-num); font-weight: 500; }
.toggle-name { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 10px; text-align: left; min-width: 0; flex: 1; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; }
.check.on { background: var(--sel); border-color: var(--sel); color: var(--sel-ink); }
.check svg { width: 12px; height: 12px; }

/* town */
.city-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
.city-scroll::-webkit-scrollbar { display: none; }
.city-scroll .chip { white-space: nowrap; }
.wx { background: var(--surface); border-radius: 16px; padding: 18px 16px 6px; display: grid; gap: 14px; }
.wx-now { display: flex; align-items: flex-end; gap: 14px; }
.wx-now .temp { font-family: var(--f-display); font-size: 76px; line-height: .85; letter-spacing: -.03em; }
.wx-now .ico { width: 34px; height: 34px; color: var(--gold); margin-bottom: 6px; }
.wx-days { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.wx-day { padding: 12px 4px; text-align: center; display: grid; justify-items: center; gap: 4px; font-size: 13px; }
.wx-day + .wx-day { border-left: 1px solid var(--line); }
.wx-day svg { width: 20px; height: 20px; color: var(--ink-2); }
.tagline { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }

.switch { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; padding-bottom: 12px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 44px; height: 26px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line-2); position: relative; flex: none; transition: background .15s; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-2); transition: transform .15s; }
.switch input:checked + .track { background: var(--gold); border-color: var(--gold); }
.switch input:checked + .track .knob { transform: translateX(18px); background: var(--gold-ink); }
.switch input:focus-visible + .track { outline: 2px solid var(--gold); outline-offset: 2px; }
.seg button { min-width: 0; }
input[type="date"] { min-height: 46px; }
.sync { font-size: 10px; letter-spacing: .12em; }
.sync[data-state="live"] { color: var(--win); }
.sync[data-state="offline"] { color: var(--loss); }
.sync:not(:empty)::before { content: "· "; color: var(--muted); }
.banks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bank { background: var(--surface); border: 0; border-radius: 16px; padding: 16px 12px 14px; display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.bank .t { font-weight: 600; margin-top: 4px; }
.bank .s { font-size: 12px; color: var(--muted); }
.empty-bank { border: 1px dashed var(--line-2); background: transparent; align-content: center; min-height: 150px; gap: 8px; }
.donut-wrap { position: relative; width: 104px; height: 104px; }
.donut { width: 100%; height: 100%; display: block; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.donut-center b { font-family: var(--f-display); font-size: 24px; font-weight: 400; }
.donut-center span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.legend { display: flex; align-items: center; gap: 5px; font-size: 11px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; }
.day-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
.day-scroll::-webkit-scrollbar { display: none; }
.daychip { display: grid; justify-items: center; gap: 0; padding: 6px 12px; min-width: 52px; }
.daychip span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.daychip b { font-size: 17px; font-weight: 600; }
/* wallet */
.card-art { aspect-ratio: 1.586; max-width: 100%; border-radius: 18px; padding: 20px; display: grid; align-content: space-between; position: relative; overflow: hidden;
  background: radial-gradient(120% 90% at 0% 0%, #34373d 0%, #1b1d21 55%, #121316 100%); color: #f3f1ec; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.card-art::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 6px); pointer-events: none; }
.card-art > * { position: relative; z-index: 1; }
.card-art .brand { font-family: var(--f-display); font-size: 22px; font-style: italic; color: #d9b874; }
.card-art .bal { font-family: var(--f-display); font-size: 44px; line-height: 1; }
.card-art .meta { display: flex; justify-content: space-between; align-items: end; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #a6a39c; }
.card-art .emv { width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #d9b874, #9c7a36); opacity: .9; }
.soon { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: 14px; white-space: nowrap;
  display: flex; align-items: center; gap: 14px; }
.toast-undo { background: none; border: 0; padding: 0; color: var(--gold); font-weight: 600; font-size: 14px; }
.toast { z-index: 60; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>

<header class="top gutter" id="topbar">
  <button class="trip" id="cityBtn" type="button" aria-label="Change city">
    <span class="eyebrow"><span id="tripName">Trip</span> <span id="syncDot" class="sync"></span></span>
    <span class="where"><span id="cityName">Atlantic City</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg></span>
  </button>
  <button class="stack" id="crewBtn" type="button" aria-label="Crew"></button>
  <button class="round" id="walletBtn" type="button" aria-label="Wallet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/></svg></button>
</header>

<main id="view" class="gutter"></main>

<nav class="tabs" id="tabs" aria-label="Sections">

function drawWheel() {
  const cv = $("#wheel"); if (!cv) return;
  const ctx = cv.getContext("2d"), W = cv.width, R = W / 2, ps = rPlayers();
  const RED = "#8f2b2b", BLACK = "#1b1d20", GREEN = "#1d5a44", GOLD = "#cfaa63", IVORY = "#f3f1ec";
  ctx.clearRect(0, 0, W, W);
  ctx.save(); ctx.translate(R, R);
  const rim = ctx.createRadialGradient(0, 0, R * .8, 0, 0, R);
  rim.addColorStop(0, "#3a2c16"); rim.addColorStop(.5, "#6b5228"); rim.addColorStop(1, "#2a2010");
  ctx.beginPath(); ctx.arc(0, 0, R - 2, 0, Math.PI * 2); ctx.fillStyle = rim; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, R - 22, 0, Math.PI * 2); ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.stroke();
  const n = Math.max(ps.length, 1), seg = Math.PI * 2 / n, inner = R - 24;
  for (let i = 0; i < n; i++) {
    const a0 = wheelRot + i * seg;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, inner, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = !ps.length ? "#2a2d32" : (n % 2 && i === n - 1) ? GREEN : i % 2 ? BLACK : RED; ctx.fill();
    if (n > 1) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a0) * inner, Math.sin(a0) * inner); ctx.strokeStyle = "rgba(207,170,99,.55)"; ctx.lineWidth = 2; ctx.stroke(); }
    if (ps[i]) {
      ctx.save(); ctx.rotate(a0 + seg / 2); ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillStyle = IVORY;
      ctx.font = `500 ${n > 8 ? 24 : 30}px "Geist", system-ui, sans-serif`;
      let label = ps[i].name; if (label.length > 12) label = label.slice(0, 11) + "…";
      ctx.fillText(label, inner - 26, 0); ctx.restore();
    }
  }
  ctx.beginPath(); ctx.arc(0, 0, R * .36, 0, Math.PI * 2); ctx.fillStyle = "#141518"; ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.stroke();
  for (let k = 0; k < 4; k++) { ctx.save(); ctx.rotate(wheelRot + k * Math.PI / 2); ctx.beginPath(); ctx.moveTo(R * .12, -5); ctx.lineTo(R * .31, 0); ctx.lineTo(R * .12, 5); ctx.fillStyle = GOLD; ctx.fill(); ctx.restore(); }
  const hub = ctx.createRadialGradient(-10, -10, 4, 0, 0, R * .16);
  hub.addColorStop(0, "#f0d79c"); hub.addColorStop(1, "#8a6a2c");
  ctx.beginPath(); ctx.arc(0, 0, R * .13, 0, Math.PI * 2); ctx.fillStyle = hub; ctx.fill();
  ctx.restore();
}
function spin() {
  if (S.tab !== "roulette") { setTab("roulette"); return; }
  const ps = rPlayers(); if (ps.length < 2 || spinning || spinResult) return;
  spinning = true;
  const k = rand(ps.length), n = ps.length, seg = Math.PI * 2 / n, TAU = Math.PI * 2;
  const jitter = (Math.random() - 0.5) * seg * 0.7;
  const want = -Math.PI / 2 - (k + 0.5) * seg + jitter;
  const delta = ((want - wheelRot) % TAU + TAU) % TAU;
  const start = wheelRot, total = delta + TAU * (5 + rand(3));
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur = reduce ? 1 : 3800, t0 = performance.now();
  const btn = view.querySelector('[data-act="spin"]'); if (btn) btn.disabled = true;
  function frame(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    wheelRot = start + total * e; drawWheel();
    if (p < 1) return requestAnimationFrame(frame);
    wheelRot = wheelRot % TAU; spinning = false;
    const picked = ps[k];
    if (S.roulette.rule === "last") {
      safeIds.push(picked.key); toast(picked.name + " is safe");
      const left = rPlayers();
      if (left.length === 1) spinResult = left[0].name;
    } else spinResult = picked.name;
    if (navigator.vibrate) try { navigator.vibrate(spinResult ? [60, 40, 120] : 30); } catch (e) {}
    render();
  }
  requestAnimationFrame(frame);
}
function logRoulette() {
  const r = S.roulette, n = (r.mode === "crew" ? r.inIds.length : r.quick.length);
  r.history.push({ id: uid(), who: spinResult, bill: r2(+r.bill || 0), what: r.what, n, ts: Date.now() });

/* ---------- SPLIT ---------- */
function roomTotal(r) { return r2(r.nightly * r.nights * (1 + (r.tax || 0) / 100)); }
function ledger() {
  const bal = {}; S.people.forEach(p => bal[p.id] = { paid: 0, owes: 0 });
  const add = (id, k, v) => { if (bal[id]) bal[id][k] += v; };
  S.rooms.forEach(r => {
    const tot = roomTotal(r), pn = r.guests.reduce((a, g) => a + g.nights, 0);
    if (!pn) return;
    add(r.paidBy, "paid", tot);
    r.guests.forEach(g => add(g.personId, "owes", tot * g.nights / pn));
  });
  S.expenses.forEach(x => {
    if (!x.among.length) return;
    add(x.paidBy, "paid", x.amount);
    x.among.forEach(id => add(id, "owes", x.amount / x.among.length));
  });
  const net = S.people.map(p => ({ id: p.id, v: r2(bal[p.id].paid - bal[p.id].owes), ...bal[p.id] }));
  const cred = net.filter(x => x.v > 0.009).map(x => ({ ...x })).sort((a, b) => b.v - a.v);
  const debt = net.filter(x => x.v < -0.009).map(x => ({ ...x, v: -x.v })).sort((a, b) => b.v - a.v);
  const tr = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const amt = r2(Math.min(debt[i].v, cred[j].v));
    if (amt > 0.009) tr.push({ from: debt[i].id, to: cred[j].id, amt });
    debt[i].v = r2(debt[i].v - amt); cred[j].v = r2(cred[j].v - amt);
    if (debt[i].v < 0.01) i++; if (cred[j].v < 0.01) j++;
  }
  return { net, tr };
}

const wxLoading = {};
function loadWeather() {
  const key = S.city, c = city(), cached = S.weather[key];
  if (cached && !cached.sample && Date.now() - cached.at < 30 * 60000) return;
  if (cached && cached.sample && Date.now() - cached.at < 5 * 60000) return;
  if (wxLoading[key]) return; wxLoading[key] = true;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=4`;
  const ctl = window.AbortController ? new AbortController() : null; const to = setTimeout(() => ctl && ctl.abort(), 6000);
  fetch(url, ctl ? { signal: ctl.signal } : {}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    S.weather[key] = { at: Date.now(), t: Math.round(d.current.temperature_2m), f: Math.round(d.current.apparent_temperature), code: d.current.weather_code,
      wind: Math.round(d.current.wind_speed_10m), days: d.daily.time.map((_, i) => [d.daily.weather_code[i], Math.round(d.daily.temperature_2m_max[i]), Math.round(d.daily.temperature_2m_min[i]), d.daily.precipitation_probability_max[i] || 0]),
      dates: d.daily.time };
  }).catch(() => { S.weather[key] = Object.assign({ at: Date.now(), sample: true }, SAMPLE_WX[key]); })
    .finally(() => { clearTimeout(to); wxLoading[key] = false; save(); if (S.tab === "town" && S.city === key) render(); });
}
function vOverview() {

      return `<div class="wx-day"><span class="muted">${name}</span>${wxIcon(d[0])}<span class="num">${d[1]}° <span class="muted">${d[2]}°</span></span><span class="muted small">${d[3]}% rain</span></div>`; }).join("");

const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDay = s => parseYmd(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });
function tripState() {
  if (!S.trip) {
    const d = new Date(); const add = (5 - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + add);
    const out = new Date(d); out.setDate(out.getDate() + 2);
    S.trip = { in: ymd(d), out: ymd(out), home: "PHL", direct: false };
  }
  return S.trip;
}
function nightsOf(t) {
  const a = parseYmd(t.in), b = parseYmd(t.out), list = [];
  for (const d = new Date(a); d < b && list.length < 30; d.setDate(d.getDate() + 1)) list.push(new Date(d));
  return list;
}
function hotelEstimate(key, tier, nights) {
  const H = HOTELS[key]; let sum = 0;
  nights.forEach(d => {
    const wk = d.getDay() === 5 || d.getDay() === 6;
    const spike = SPIKES[String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")] || 1;
    sum += tier.rate[wk ? 1 : 0] * H.month[d.getMonth()] * spike;
  });
  return sum;
}
const round5 = n => Math.round(n / 5) * 5;
function bookingUrl(key, tier, t) {
  return `https://www.booking.com/searchresults.html?ss=${encodeURIComponent(HOTELS[key].q)}&checkin=${t.in}&checkout=${t.out}&group_adults=2&no_rooms=1&nflt=${tier.stars}&order=price`;
}
function kayakFlights(from, to, t) {
  return `https://www.kayak.com/flights/${from}-${to}/${t.in}/${t.out}?sort=price_a${t.direct ? "&fs=stops=0" : ""}`;
}
function googleFlights(from, to, t) {
  const q = `Flights from ${from} to ${to} on ${t.in} returning ${t.out}${t.direct ? " nonstop" : ""}`;
  return "https://www.google.com/travel/flights?q=" + encodeURIComponent(q);
}

function vPoker() {
  const P = POKER[S.city], today = ymd(new Date());
  const t = tripState(), tripDays = [];
  for (const d = parseYmd(t.in); ymd(d) <= t.out && tripDays.length < 10; d.setDate(d.getDate() + 1)) tripDays.push(ymd(d));
  const sel = tripDays.includes(S.pokerDate) ? S.pokerDate : tripDays.includes(today) ? today : tripDays[0];
  const day = parseYmd(sel).getDay();
  const onDay = P.specials.filter(s => !s.tbd && s.start <= sel && s.end >= sel);
  const list = P.daily.filter(x => x.days.includes(String(day)) && !(/outside series/.test(x.name) && onDay.some(s => s.room === x.room)))
    .sort((a, b) => toMin(a.time) - toMin(b.time));

  const during = P.specials.filter(s => !s.tbd && s.start <= t.out && s.end >= t.in && s.end >= today);
  const later = P.specials.filter(s => !during.includes(s) && s.end >= today);
  const spRow = s => {
    const live = s.start <= today && !s.tbd;
    return `<div class="row" style="align-items:start"><div class="grow" style="display:grid;gap:3px">
      <span class="tagline" style="color:${live ? "var(--win)" : "var(--gold)"}">${live ? "Happening now" : s.tbd ? "Dates not posted" : fmtDay(s.start) + (s.end !== s.start ? " – " + fmtDay(s.end) : "")}</span>
      <div class="t" style="white-space:normal">${esc(s.name)}</div>
      <div class="s" style="white-space:normal">${esc(s.room)}${s.detail ? " · " + esc(s.detail) : ""}</div></div></div>`;
  };
  const dayChip = d => { const x = parseYmd(d); return `<button type="button" class="chip daychip" data-act="pokerDate" data-v="${d}" aria-pressed="${d === sel}"><span>${x.toLocaleDateString("en-US", { weekday: "short" })}</span><b>${x.getDate()}</b></button>`; };
  const seriesToday = onDay.map(s => `<div class="row"><div class="grow"><div class="tagline">Series running</div><div class="t" style="white-space:normal">${esc(s.name)}</div><div class="s">${esc(s.room)} · events most of the day</div></div></div>`).join("");
  const rooms = [...new Set(P.daily.map(x => x.room).concat(P.specials.map(s => s.room)))].filter(r => ROOM_LINKS[r]);
  if (S.city === "lv") rooms.push("Las Vegas");
  return `
  <div class="small muted" style="padding:0 4px">${esc(P.note)}${P.hours ? " Hours: " + esc(P.hours) : ""}</div>
  <section class="section"><div class="section-h"><h3>Your trip · ${fmtDay(t.in)} – ${fmtDay(t.out)}</h3><button class="link" data-act="townView" data-v="plan">Change dates</button></div>
    <div class="day-scroll">${tripDays.map(dayChip).join("")}</div>
    <div class="group">${seriesToday}${rows}</div></section>
  <section class="section"><div class="section-h"><h3>Series during your trip</h3></div><div class="group">${during.map(spRow).join("") || `<div class="empty">No special series overlap your dates.</div>`}</div></section>
  ${later.length ? `<section class="section"><div class="section-h"><h3>Other series</h3></div><div class="group">${later.map(spRow).join("")}</div></section>` : ""}
  <section class="section"><div class="section-h"><h3>Check before you go</h3></div>
    <div class="group">${rooms.map(r => `<a class="row" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" href="${ROOM_LINKS[r]}"><div class="grow t">${r === "Las Vegas" ? "All Las Vegas tournaments today" : esc(r) + " schedule"}</div><span class="link small">Open</span></a>`).join("")}</div>
    <div class="small muted" style="padding:0 4px">Checked ${VERIFIED} against ${esc(P.src)} Schedules change and guarantees can be cut, so confirm with the room.</div></section>`;
}
function toMin(t) { const m = t.match(/(\d+):(\d+)(am|pm)/); let h = +m[1] % 12; if (m[3] === "pm") h += 12; return h * 60 + +m[2]; }

      ${shareRow()}
      <button class="btn gold block" data-k="close">Done</button>`;
    setTimeout(() => { const i = $("#newName", el); if (i && !S.people.length) i.focus(); }, 50);
  };
  openSheet("", el => {
    draw(el);
    const add = () => { const i = $("#newName", el), v = i.value.trim(); if (!v) return;
      v.split(",").map(s => s.trim()).filter(Boolean).forEach(n => { const p = { id: uid(), name: n.slice(0, 20) }; S.people.push(p); S.roulette.inIds.push(p.id); });
      save(); draw(el); render(); $("#newName", el).focus(); };
    el.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "newName") { e.preventDefault(); add(); } });
    el.addEventListener("input", e => { if (e.target.id === "tripIn") { S.tripName = e.target.value; save(); $("#tripName").textContent = S.tripName || "Trip"; } });
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.k === "close") { closeSheet(); render(); }
      else if (b.dataset.k === "add") add();
      else if (b.dataset.k === "share") copyText(shareLink(), "Trip link copied");
      else if (b.dataset.k === "makeShared") { newSharedTrip(); draw(el); }
      else if (b.dataset.del) {
        const id = b.dataset.del, gone = pname(id), before = JSON.stringify(S);
        S.people = S.people.filter(p => p.id !== id);
        S.sessions = S.sessions.filter(s => s.personId !== id);
        S.expenses = S.expenses.filter(x => x.paidBy !== id).map(x => ({ ...x, among: x.among.filter(a => a !== id) })).filter(x => x.among.length);
        S.rooms = S.rooms.filter(r => r.paidBy !== id).map(r => ({ ...r, guests: r.guests.filter(g => g.personId !== id) }));
        S.roulette.inIds = S.roulette.inIds.filter(x => x !== id);
        if (S.budgets) delete S.budgets[id];
        save(); draw(el); render();
        toast(`Removed ${gone}`, () => { S = JSON.parse(before); save(); render(); if ($("#scrim")) draw($(".sheet")); });
      }
    });
  });
}
function openCitySheet() {
  openSheet(`<div class="sheet-h"><h2>Where are you playing?</h2></div><div class="group" style="background:var(--raised)">${Object.entries(CITIES).map(([k, v]) => `<button type="button" class="row" style="width:100%;border:0;background:none;text-align:left" data-c="${k}"><div class="grow"><div class="t">${esc(v.name)}</div><div class="s">${esc(v.region)} · ${v.casinos.length} casino${v.casinos.length === 1 ? "" : "s"}</div></div>${k === S.city ? `<span class="check on">${I.check}</span>` : ""}</button>`).join("")}</div>`,
    el => el.addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) { S.city = b.dataset.c; save(); closeSheet(); render(); } }));
}
function openFreshSheet() {
  openSheet(`<div class="sheet-h"><h2>Start your trip</h2></div><div class="muted">${tripId === MAIN_TRIP && !S.example ? "This clears the crew, sessions and bills for everyone using this app." : "This clears the example crew, sessions and bills."}</div>
    <div class="btn-row"><button class="btn" id="fNo">Keep looking</button><button class="btn gold" id="fYes">Start fresh</button></div>`,
    el => { $("#fNo", el).onclick = closeSheet; $("#fYes", el).onclick = () => { S = blank(S.city); S.budgets = {}; if (tripId !== MAIN_TRIP) newSharedTrip(); save(); closeSheet(); render(); openCrewSheet(); }; });
}

render();
startSync();
if ("serviceWorker" in navigator && location.protocol === "https:" && document.querySelector('link[rel="manifest"]')) {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
})();
</script>
